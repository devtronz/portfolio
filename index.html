<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiro Style Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">MY STUDIO</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Full Screen Video Section -->
  <section class="video-hero">
    <!-- Replace the src link with any MP4 video link -->
    <video autoplay loop muted playsinline class="bg-video">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
    
    <!-- Dark overlay and text -->
    <div class="video-overlay">
      <h1>Creative Video Studio</h1>
      <p>Capturing the best moments of life.</p>
      <a href="#" class="btn">View Portfolio</a>
    </div>
  </section>

</body>
</html>
