<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspiro Style Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">MY STUDIO</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">Portfolio</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Full Screen Video Section -->
  <section class="video-hero">
    <!-- Replace the src link with any MP4 video link -->
    <video autoplay loop muted playsinline class="bg-video">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
    </video>
    
    <!-- Dark overlay and text -->
    <div class="video-overlay">
      <h1>Creative Video Studio</h1>
      <p>Capturing the best moments of life.</p>
      <a href="#" class="btn">View Portfolio</a>
    </div>
  </section>

  <!-- Portfolio / Gallery Section -->
  <section class="portfolio-section">
    <h2>Selected Works</h2>
    
    <div class="portfolio-grid">
      
      <!-- Project 1 -->
      <div class="portfolio-item">
        <!-- Using high-quality placeholder images -->
        <img src="https://images.unsplash.com/photo-1492691527719-9d1e07e534b4?auto=format&fit=crop&w=800&q=80" alt="Project 1">
        <div class="item-overlay">
          <h3>Cinematic Journey</h3>
          <p>Short Film</p>
        </div>
      </div>

      <!-- Project 2 -->
      <div class="portfolio-item">
        <img src="https://images.unsplash.com/photo-1601506521937-0121a7fc2a6b?auto=format&fit=crop&w=800&q=80" alt="Project 2">
        <div class="item-overlay">
          <h3>Urban Exploration</h3>
          <p>Photography</p>
        </div>
      </div>

      <!-- Project 3 -->
      <div class="portfolio-item">
        <img src="https://images.unsplash.com/photo-1534353436294-0dbd4bdac845?auto=format&fit=crop&w=800&q=80" alt="Project 3">
        <div class="item-overlay">
          <h3>Nature's Whisper</h3>
          <p>Documentary</p>
        </div>
      </div>

      <!-- Project 4 -->
      <div class="portfolio-item">
        <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80" alt="Project 4">
        <div class="item-overlay">
          <h3>Tech Revolution</h3>
          <p>Commercial</p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
